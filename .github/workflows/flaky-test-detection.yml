name: Flaky Test Detection

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly to catch intermittent failures
    - cron: '0 2 * * *'

jobs:
  flaky-test-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --frozen
          uv pip install -e ".[dev]"

      - name: Run integration tests multiple times
        id: test_runs
        run: |
          RUNS=5
          RESULTS_FILE="flaky_test_results.json"
          echo "{\"runs\": [], \"summary\": {}}" > "$RESULTS_FILE"

          for run in $(seq 1 $RUNS); do
            echo "=== Integration Test Run $run/$RUNS ==="

            # Run tests with JSON output
            uv run pytest tests/integration/ -v --tb=short --strict-markers --disable-warnings -q \
              --json-report --json-report-file="test_run_${run}.json" || TEST_EXIT=$?

            if [ ! -f "test_run_${run}.json" ]; then
              # Fallback: capture output manually
              uv run pytest tests/integration/ -v --tb=short --strict-markers --disable-warnings -q > "test_run_${run}.log" 2>&1 || true
            fi
          done

          echo "results_file=$RESULTS_FILE" >> $GITHUB_OUTPUT

      - name: Analyze test results for flakiness
        id: analyze
        run: |
          python3 << 'EOF'
          import json
          import os
          import re
          from collections import defaultdict
          from pathlib import Path

          # Track test results across runs
          test_results = defaultdict(lambda: {"passed": 0, "failed": 0, "runs": []})
          runs_count = 5

          # Parse test results from log files or JSON
          for run in range(1, runs_count + 1):
              log_file = f"test_run_{run}.log"
              json_file = f"test_run_{run}.json"

              if os.path.exists(json_file):
                  with open(json_file, 'r') as f:
                      try:
                          data = json.load(f)
                          for test in data.get('tests', []):
                              test_name = test.get('nodeid', '')
                              outcome = test.get('outcome', 'unknown')
                              if outcome == 'passed':
                                  test_results[test_name]['passed'] += 1
                              elif outcome == 'failed':
                                  test_results[test_name]['failed'] += 1
                              test_results[test_name]['runs'].append(outcome)
                      except json.JSONDecodeError:
                          pass

              elif os.path.exists(log_file):
                  with open(log_file, 'r') as f:
                      content = f.read()
                      # Parse pytest output format: PASSED or FAILED
                      for line in content.split('\n'):
                          if ' PASSED' in line or ' FAILED' in line:
                              test_name = line.split(' ')[0].strip()
                              if test_name and '::' in test_name:
                                  if ' PASSED' in line:
                                      test_results[test_name]['passed'] += 1
                                      test_results[test_name]['runs'].append('passed')
                                  elif ' FAILED' in line:
                                      test_results[test_name]['failed'] += 1
                                      test_results[test_name]['runs'].append('failed')

          # Identify flaky tests (tests that don't pass consistently)
          flaky_tests = []
          stable_passed = []
          stable_failed = []

          for test_name, results in sorted(test_results.items()):
              total_runs = results['passed'] + results['failed']
              if total_runs == 0:
                  continue

              if total_runs < runs_count:
                  # Test wasn't found in all runs - skip
                  continue

              failure_count = results['failed']
              failure_rate = (failure_count / total_runs) * 100

              # Flaky: Sometimes passes, sometimes fails (between 20% and 80%)
              if 0 < failure_count < total_runs:
                  flaky_tests.append({
                      'name': test_name,
                      'passed': results['passed'],
                      'failed': failure_count,
                      'total_runs': total_runs,
                      'failure_rate': failure_rate,
                      'runs': results['runs']
                  })
              elif failure_count == 0:
                  stable_passed.append(test_name)
              else:
                  stable_failed.append(test_name)

          # Generate report
          report = {
              'timestamp': None,  # Will be set by workflow
              'commit_hash': os.environ.get('GITHUB_SHA', 'unknown')[:7],
              'total_runs': runs_count,
              'summary': {
                  'total_unique_tests': len(test_results),
                  'stable_passed': len(stable_passed),
                  'stable_failed': len(stable_failed),
                  'flaky_tests_count': len(flaky_tests)
              },
              'flaky_tests': flaky_tests,
              'stable_passed_tests': stable_passed,
              'stable_failed_tests': stable_failed
          }

          # Write JSON report
          with open('flaky_test_report.json', 'w') as f:
              json.dump(report, f, indent=2)

          # Write markdown report
          with open('FLAKY_TEST_REPORT.md', 'w') as f:
              f.write('# Flaky Test Detection Report\n\n')
              f.write(f'**Commit**: `{report["commit_hash"]}`\n\n')
              f.write(f'**Test Runs**: {report["total_runs"]}\n\n')
              f.write('## Summary\n\n')
              f.write(f'- **Total Unique Tests**: {report["summary"]["total_unique_tests"]}\n')
              f.write(f'- **Stable (Passed)**: {report["summary"]["stable_passed"]}\n')
              f.write(f'- **Stable (Failed)**: {report["summary"]["stable_failed"]}\n')
              f.write(f'- **Flaky Tests**: {report["summary"]["flaky_tests_count"]}\n\n')

              if flaky_tests:
                  f.write('## Flaky Tests Detected\n\n')
                  f.write('| Test Name | Failure Rate | Passed/Failed | Pattern |\n')
                  f.write('|-----------|-------------|---------------|----------|\n')
                  for test in sorted(flaky_tests, key=lambda x: x['failure_rate'], reverse=True):
                      pattern = ''.join(['✓' if r == 'passed' else '✗' for r in test['runs']])
                      f.write(f'| `{test["name"]}` | {test["failure_rate"]:.1f}% | {test["passed"]}/{test["failed"]} | {pattern} |\n')
              else:
                  f.write('## Status\n\n')
                  f.write('✅ No flaky tests detected!\n')

              if stable_failed:
                  f.write('\n## Consistently Failing Tests\n\n')
                  f.write('These tests fail in all runs and require investigation:\n\n')
                  for test in stable_failed[:10]:  # Limit to first 10
                      f.write(f'- `{test}`\n')
                  if len(stable_failed) > 10:
                      f.write(f'- ... and {len(stable_failed) - 10} more\n')

          print(f"Flaky tests: {len(flaky_tests)}")
          print(f"Stable (passed): {len(stable_passed)}")
          print(f"Stable (failed): {len(stable_failed)}")

          # Set output for workflow
          print(f"::set-output name=flaky_count::{len(flaky_tests)}")
          print(f"::set-output name=stable_failed_count::{len(stable_failed)}")

          EOF

      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report
          path: |
            flaky_test_report.json
            FLAKY_TEST_REPORT.md
            test_run_*.log
            test_run_*.json
          retention-days: 30

      - name: Comment on PR with flaky test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              const reportPath = 'FLAKY_TEST_REPORT.md';
              if (!fs.existsSync(reportPath)) {
                console.log('Flaky test report not found');
                return;
              }

              const reportContent = fs.readFileSync(reportPath, 'utf8');

              // Find existing flaky test report comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(comment =>
                comment.user.type === 'Bot' &&
                comment.body.includes('Flaky Test Detection Report')
              );

              const commentBody = `## 🔍 Flaky Test Detection Report\n\n${reportContent}`;

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody,
                });
              }
            } catch (error) {
              console.log('Failed to post comment:', error);
            }

      - name: Fail if flaky tests detected
        if: steps.analyze.outputs.flaky_count > 0
        run: |
          echo "❌ Flaky tests detected!"
          cat FLAKY_TEST_REPORT.md
          exit 1

      - name: Fail if consistently failing tests detected
        if: steps.analyze.outputs.stable_failed_count > 0
        run: |
          echo "❌ Consistently failing tests detected!"
          cat FLAKY_TEST_REPORT.md
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ All tests are stable across ${{ steps.test_runs.outputs.total_runs }} runs!"
